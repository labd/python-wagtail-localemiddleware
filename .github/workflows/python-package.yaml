name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate formatting
        run: |
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        env: [django52-wagtail70, django52-wagtail80]
        include:
          - { python: "3.12", env: django60-wagtail80 }
          - { python: "3.13", env: django60-wagtail80 }
          - { python: "3.14", env: django60-wagtail80 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test with tox
        run: uvx --with tox-uv tox -e "py${PYTHON//./}-${TOX_ENV}"
        env:
          PYTHON: ${{ matrix.python }}
          TOX_ENV: ${{ matrix.env }}

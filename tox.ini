[tox]
isolated_build = true
envlist =
    py{311,312,313,314}-django5.2-wagtail{7.0,8.0}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
extras =
    test
basepython =
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    django5.2: Django>=5.2,<5.3
    wagtail7.0: wagtail>=7.0,<7.1
    wagtail8.0: wagtail>=8.0,<8.1
commands =
    coverage run --parallel -m pytest -q -vvv {posargs}

[testenv:format]
basepython = python3.13
deps = ruff
skip_install = true
commands =
    ruff format --check src tests
    ruff check src tests

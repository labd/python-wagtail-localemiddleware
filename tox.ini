[tox]
requires =
    tox>=4.26
    tox-uv>=1.28
envlist =
    py{311,312,313,314}-django52-wagtail{70,80}
    py{312,313,314}-django60-wagtail80
    format

[testenv]
dependency_groups = dev
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    wagtail70: wagtail>=7.0,<7.1
    wagtail80: wagtail>=8.0,<8.1
commands =
    coverage run --parallel -m pytest -q -vvv {posargs}

[testenv:format]
skip_install = true
deps = ruff
commands =
    ruff format --check src tests
    ruff check src tests

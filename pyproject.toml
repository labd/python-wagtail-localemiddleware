[project]
name = "labdigital-wagtail-localemiddleware"
version = "0.0.1"
description = ""
authors = [
    {name = "Lab Digital BV", email = "info@labdigital.nl"},
]
dependencies = [
    "wagtail",
]
requires-python = ">=3.11"
readme = "README.rst"
license = {text = "Proprietary"}
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/wagtail-localemiddleware"

[dependency-groups]
dev = [
    "coverage",
    "django-stubs",
    "factory-boy",
    "mypy",
    "pytest-cov",
    "pytest-django",
    "pytest>=7.4",
    "requests-mock",
    "ruff",
    "tox>=4.26",
    "tox-uv>=1.28",
    "wagtail-factories>=4.2.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
filelock = "2026-10-27T00:00:00Z"  # 4.2.4 fixes GHSA-2g95-wg33-c5x2 GHSA-567q-5qvw-pf92 GHSA-9vhv-jxww-xfm5 ...
pillow = "2026-10-27T00:00:00Z"  # 13.0.0 fixes GHSA-24rc-8hj2-v98c GHSA-462x-pgg6-55fp GHSA-4rm8-3hmm-39fg ...
uv = "2026-10-27T00:00:00Z"  # 0.13.5 fixes GHSA-hq85-5cpj-mr62
virtualenv = "2026-10-27T00:00:00Z"  # 21.14.13 fixes GHSA-394h-qwmc-48pf GHSA-43mp-35q3-x3fq GHSA-494p-63j8-28p3 ...

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes --reuse-db --nomigrations --disable-warnings"

[tool.coverage.run]
branch = true
source = [
 	"labd.middleware.locale"
]

[tool.coverage.html]
directory = "reports/covhtml"

[tool.coverage.xml]
output = "reports/coverage.xml"

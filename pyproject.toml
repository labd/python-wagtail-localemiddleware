[project]
name = "labdigital-wagtail-localemiddleware"
version = "0.0.1"
description = ""
authors = [
    {name = "Lab Digital BV", email = "info@labdigital.nl"},
]
dependencies = [
    "wagtail",
]
requires-python = ">=3.11"
readme = "README.rst"
license = {text = "Proprietary"}
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/wagtail-localemiddleware"

[dependency-groups]
dev = [
    "coverage",
    "django-stubs",
    "factory-boy",
    "mypy",
    "pytest-cov",
    "pytest-django",
    "pytest>=7.4",
    "requests-mock",
    "ruff",
    "tox>=4.26",
    "tox-uv>=1.28",
    "wagtail-factories>=4.2.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes --reuse-db --nomigrations --disable-warnings"

[tool.coverage.run]
branch = true
source = [
 	"labd.middleware.locale"
]

[tool.coverage.html]
directory = "reports/covhtml"

[tool.coverage.xml]
output = "reports/coverage.xml"
